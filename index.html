<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23050514'/><rect x='4' y='4' width='8' height='2' fill='%2339ff88'/><rect x='2' y='6' width='12' height='4' fill='%2339ff88'/><rect x='3' y='10' width='2' height='2' fill='%2339ff88'/><rect x='11' y='10' width='2' height='2' fill='%2339ff88'/></svg>">
    <title>Space Invaders Reimagined</title>
    <style>
        body { margin: 0; background: #050514; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }

        /* Retro arcade cabinet frame around the play field */
        #cabinet {
            background: linear-gradient(180deg, #2b2b45 0%, #1e1e33 100%);
            border: 6px solid #44446a;
            border-radius: 18px;
            padding: 0 26px 18px;
            box-shadow: 0 0 40px #000, inset 0 0 18px #000;
        }
        #marquee {
            margin: 0 0 14px;
            padding: 10px 0;
            text-align: center;
            background: linear-gradient(180deg, #12002a 0%, #3d0a5e 50%, #12002a 100%);
            border-top: 4px solid #ff2d78;
            border-bottom: 4px solid #2de1ff;
            border-radius: 8px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 8px #ff2d78, 0 0 16px #2de1ff;
        }
        #game-container {
            position: relative;                  /* anchor for the 3D title overlay */
            border: 8px solid #0a0a18;          /* bezel */
            outline: 3px solid #5a5a8a;          /* bezel rim */
            border-radius: 10px;
            box-shadow: inset 0 0 22px #000;     /* screen depth */
            line-height: 0;                      /* kill canvas inline gap */
            touch-action: none;                  /* prevent browser scroll/zoom on the canvas */
        }
        /* 3D title: CSS perspective + layered text-shadow extrusion (this Phaser build has no skew API)
           41.667% = 250/600, the title's y in game coords; canvas is unscaled 800x600 */
        #title-3d {
            position: absolute; left: 50%; top: 41.667%;
            transform: translate(-50%, -50%) perspective(420px) rotateX(14deg);
            transform-origin: 50% 100%;
            font-size: 40px; font-weight: bold; letter-spacing: 2px;
            color: #fff; white-space: nowrap;
            text-shadow: 1px 1px 0 #33418c, 2px 2px 0 #2c3a7d, 3px 3px 0 #25326b, 4px 4px 0 #1e2a59;
            pointer-events: none;
            display: none;
        }
        #title-3d.on { display: block; }
        #game-container canvas { border-radius: 4px; }
        #controls {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            color: #8888bb;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #controls .joystick { color: #ff2d78; }
        #controls .coin { color: #ffd23d; animation: blink 1.4s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0.25; } }
        /* Mobile: strip cabinet chrome, fill the screen */
        @media (max-width: 850px), (max-height: 650px) {
            #cabinet { border: none; border-radius: 0; padding: 0; box-shadow: none; background: none; }
            #marquee, #controls { display: none; }
            #game-container { border: none; outline: none; border-radius: 0; box-shadow: none; }
            #game-container canvas { border-radius: 0; }
            body { min-height: 100vh; min-height: 100dvh; }
            #title-3d { font-size: 28px; letter-spacing: 1px; }
        }
        /* Portrait prompt: shown only on small screens in portrait orientation */
        #rotate-prompt {
            display: none;
            position: fixed; inset: 0;
            background: #050514;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #44ff66;
            font-family: 'Courier New', monospace;
            font-size: 22px;
            text-align: center;
            padding: 24px;
        }
        #rotate-prompt .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: rotateHint 1.6s ease-in-out infinite;
        }
        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (max-width: 850px) and (orientation: portrait) {
            #rotate-prompt { display: flex; }
            #cabinet { display: none; }
        }
        /* In-game mute button: top-right corner, mobile only */
        #mute-btn {
            display: none;
            position: fixed;
            top: 10px; right: 10px;
            z-index: 100;
            width: 44px; height: 44px;
            background: rgba(13, 40, 24, 0.7);
            border: 2px solid #44ff66;
            border-radius: 8px;
            color: #44ff66;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        @media (max-width: 850px), (max-height: 650px) {
            #mute-btn { display: block; }
        }


    </style>
    <!-- Load Phaser library (local copy — no internet required) -->
    <script src="lib/phaser.min.js"></script>
</head>
<body>
    <div id="rotate-prompt">
        <div class="icon">&#128241;</div>
        Rotate your phone<br>to landscape
    </div>
    <button id="mute-btn" aria-label="Toggle sound">&#128266;</button>

    <div id="cabinet">
        <div id="marquee">SPACE&nbsp;INVADERS</div>
        <div id="game-container">
            <div id="title-3d">SPACE&nbsp;INVADERS</div>
        </div>
        <div id="controls">
            <span class="joystick">&#9679; Arrows / Drag &mdash; Move</span>
            <span>Space / Hold &mdash; Fire</span>
            <span>M &mdash; Mute</span>
            <span class="coin">Insert Coin</span>
        </div>
    </div>

    <!-- Load game classes before the scene that uses them -->
    <script type="text/javascript" src="ballistic.js"></script>
    <script type="text/javascript" src="Invader.js"></script>
    <script type="text/javascript" src="BulletBullet.js"></script>
    <script type="text/javascript" src="EnemyBullet.js"></script>
    <script type="text/javascript" src="Shield.js"></script>
    <script type="text/javascript" src="Boss.js"></script>
    <script type="text/javascript" src="PowerUp.js"></script>
    <script type="text/javascript" src="sfx.js"></script>
    <script type="text/javascript" src="mainScene.js"></script>
</body>
