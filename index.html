<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>Space Invaders Reimagined</title>
    <style>
        body { margin: 0; background: #050514; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }

        /* Retro arcade cabinet frame around the play field */
        #cabinet {
            background: linear-gradient(180deg, #2b2b45 0%, #1e1e33 100%);
            border: 6px solid #44446a;
            border-radius: 18px;
            padding: 0 26px 18px;
            box-shadow: 0 0 40px #000, inset 0 0 18px #000;
        }
        #marquee {
            margin: 0 0 14px;
            padding: 10px 0;
            text-align: center;
            background: linear-gradient(180deg, #12002a 0%, #3d0a5e 50%, #12002a 100%);
            border-top: 4px solid #ff2d78;
            border-bottom: 4px solid #2de1ff;
            border-radius: 8px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 8px #ff2d78, 0 0 16px #2de1ff;
        }
        #game-container {
            border: 8px solid #0a0a18;          /* bezel */
            outline: 3px solid #5a5a8a;          /* bezel rim */
            border-radius: 10px;
            box-shadow: inset 0 0 22px #000;     /* screen depth */
            line-height: 0;                      /* kill canvas inline gap */
        }
        #game-container canvas { border-radius: 4px; }
        #controls {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            color: #8888bb;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #controls .joystick { color: #ff2d78; }
        #controls .coin { color: #ffd23d; animation: blink 1.4s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0.25; } }
    </style>
    <!-- Load Phaser library (local copy — no internet required) -->
    <script src="lib/phaser.min.js"></script>
</head>
<body>
    <div id="cabinet">
        <div id="marquee">SPACE&nbsp;INVADERS</div>
        <div id="game-container"></div>
        <div id="controls">
            <span class="joystick">&#9679; Arrows &mdash; Move</span>
            <span>Space &mdash; Fire</span>
            <span class="coin">Insert Coin</span>
        </div>
    </div>

    <!-- Load game classes before the scene that uses them -->
    <script type="text/javascript" src="Invader.js"></script>
    <script type="text/javascript" src="BulletBullet.js"></script>
    <script type="text/javascript" src="EnemyBullet.js"></script>
    <script type="text/javascript" src="sfx.js"></script>
    <script type="text/javascript" src="mainScene.js"></script>
</body>
